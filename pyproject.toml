[project]
name = "fast-bridge"
version = "0.1.0"
description = "Fast Bridge - MCP Cognitive Bridge. A contemplative transition layer connecting creative and consult MCPs. Logs meditation↔critique cycles, detects optimal mode-switch moments, and injects context seamlessly."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.14.1",
    "nltk>=3.9.2",
]
authors = [
    {name = "BridgeTheory", email = "atomic-germ@proton.me"},
]
keywords = ["mcp", "cognitive", "bridge", "meditation", "critique", "creative", "consult"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
fast-bridge = "main:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
